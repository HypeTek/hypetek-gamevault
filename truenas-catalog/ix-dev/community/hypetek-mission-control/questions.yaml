groups:
  - name: Mission Control Configuration
    description: Configure HypeTek Mission Control
  - name: Network Configuration
    description: Configure network access for Mission Control
  - name: Storage Configuration
    description: Configure game, configuration and translator storage
  - name: Labels Configuration
    description: Configure additional container labels
  - name: Resources Configuration
    description: Configure resource limits

questions:
  - variable: TZ
    group: Mission Control Configuration
    label: Timezone
    schema:
      type: string
      default: Europe/Berlin
      required: true
      $ref:
        - definitions/timezone

  - variable: mission_control
    group: Mission Control Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: server_name
          label: Server Name
          description: Friendly name shown in the Mission Control interface.
          schema:
            type: string
            default: Mission Control
            required: true
            max_length: 80

        - variable: library_name
          label: Primary Library Name
          description: Friendly name of the primary game archive mounted at /games.
          schema:
            type: string
            default: Mission Control Game Archive
            required: true
            max_length: 120

        - variable: windows_root
          label: Windows / SMB Library Path
          description: Reachable Windows path for the primary library, for example Z:\\Game or \\\\server\\Games.
          schema:
            type: string
            default: Z:\\Game
            required: true

        - variable: admin_password
          label: Admin Password
          description: Password used to sign in to the Mission Control web interface.
          schema:
            type: string
            required: true
            private: true
            min_length: 12

        - variable: agent_token
          label: Windows Agent Token
          description: Shared token used to authenticate the Windows agent. Use a long random value.
          schema:
            type: string
            required: true
            private: true
            min_length: 20

        - variable: secret_key
          label: Session Secret Key
          description: Secret used to protect Mission Control web sessions. Use a long random value.
          schema:
            type: string
            required: true
            private: true
            min_length: 20

        - variable: enable_translator
          label: Enable Managed Translator
          description: Run the bundled LibreTranslate service inside the application network.
          schema:
            type: boolean
            default: true

        - variable: translator_languages
          label: Translator Languages
          description: Comma-separated LibreTranslate model set loaded by the managed translator.
          schema:
            type: string
            default: en,de,ru,it,fr,es,pt,pl,nl,tr,ar,zh
            show_if: [["enable_translator", "=", true]]
            required: true

        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: network
    group: Network Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: Publish the port on the TrueNAS host for normal browser access.
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host for external access
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                description: Host port mapped to Mission Control's fixed internal port 8080.
                schema:
                  type: int
                  default: 9998
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port.
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

        - variable: networks
          label: Networks
          description: Existing Docker networks the application containers should join.
          schema:
            type: list
            show_if: [["host_network", "=", false]]
            default: []
            items:
              - variable: network
                label: Network
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        default: ""
                        required: true
                    - variable: containers
                      label: Containers
                      schema:
                        type: list
                        items:
                          - variable: container
                            label: Container
                            schema:
                              type: dict
                              attrs:
                                - variable: name
                                  label: Container Name
                                  schema:
                                    type: string
                                    required: true
                                    enum:
                                      - value: mission-control
                                        description: mission-control
                                      - value: translator
                                        description: translator
                                - variable: config
                                  label: Container Network Configuration
                                  schema:
                                    type: dict
                                    attrs:
                                      - variable: aliases
                                        label: Aliases
                                        schema:
                                          type: list
                                          default: []
                                          items:
                                            - variable: alias
                                              label: Alias
                                              schema:
                                                type: string
                                      - variable: interface_name
                                        label: Interface Name
                                        schema:
                                          type: string
                                      - variable: mac_address
                                        label: MAC Address
                                        schema:
                                          type: string
                                      - variable: ipv4_address
                                        label: IPv4 Address
                                        schema:
                                          type: string
                                      - variable: ipv6_address
                                        label: IPv6 Address
                                        schema:
                                          type: string
                                      - variable: gw_priority
                                        label: Gateway Priority
                                        schema:
                                          type: int
                                          "null": true
                                      - variable: priority
                                        label: Priority
                                        schema:
                                          type: int
                                          "null": true

        - variable: host_network
          label: Host Network
          description: Bind containers to the host network. Keeping this disabled is recommended.
          schema:
            type: boolean
            default: false

  - variable: storage
    group: Storage Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: config
          label: Mission Control Config Storage
          description: Stores the database, covers, backgrounds, designs and backups.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: config
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

        - variable: games
          label: Primary Game Library
          description: Existing TrueNAS dataset containing games. Mounted read-only at /games.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: host_path
                  enum:
                    - value: host_path
                      description: Host Path
              - variable: read_only
                label: Read Only
                schema:
                  type: boolean
                  default: true
                  hidden: true
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      description: Example /mnt/Titan/Game
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

        - variable: translator_models
          label: Translator Model Storage
          description: Persistent cache for LibreTranslate language models.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path
                    - value: ix_volume
                      description: ixVolume
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - normalize/ix_volume
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: translator-models
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - normalize/acl
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

        - variable: additional_storage
          label: Additional Libraries
          description: Optional extra game datasets. Use mount paths below /libraries/ and keep them read-only.
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Library Storage
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      schema:
                        type: string
                        required: true
                        default: host_path
                        enum:
                          - value: host_path
                            description: Host Path
                    - variable: read_only
                      label: Read Only
                      schema:
                        type: boolean
                        default: true
                    - variable: mount_path
                      label: Mount Path
                      description: Must be below /libraries/, for example /libraries/archive2.
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - normalize/acl
                          - variable: path
                            label: Host Path
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true

  - variable: labels
    group: Labels Configuration
    label: ""
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: mission-control
                            description: mission-control
                          - value: translator
                            description: translator

  - variable: resources
    group: Resources Configuration
    label: ""
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPU limit for Mission Control and its translator stack.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit used by the rendered app containers.
                schema:
                  type: int
                  default: 4096
                  required: true
