name: Test and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gamevault-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  container:
    name: Build and publish GHCR image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hypetek/hypetek-gamevault
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && !contains(steps.version.outputs.version, '-') }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  windows-installer:
    name: Build Windows EXE installer
    needs: [test, container]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Reject PowerShell smart quote delimiters
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath "windows-agent" -Filter "*.ps1" | ForEach-Object {
            $source = Get-Content -LiteralPath $_.FullName -Raw
            if ($source -match '[“”„]') {
              Write-Host "::error file=$($_.FullName)::Typographic smart quotes are unsafe in Windows PowerShell source."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Parse agent with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath "windows-agent" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              Write-Host "::error file=$($_.FullName)::Windows PowerShell 5.1 parse failed."
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Parse agent with PowerShell 7
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath "windows-agent" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              Write-Host "::error file=$($_.FullName)::PowerShell 7 parse failed."
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build guided agent installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows-installer\MissionControlAgent.iss"'

      - name: Write RC release manifest
        shell: powershell
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          $version = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          $installer = "windows-installer/dist/HypeTek-Mission-Control-Agent-Setup.exe"
          $installerSha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "version=$version",
            "image=ghcr.io/hypetek/hypetek-gamevault:$version",
            "image_digest=$env:IMAGE_DIGEST",
            "installer_sha256=$installerSha"
          ) | Set-Content -LiteralPath "windows-installer/dist/release-manifest.txt" -Encoding ASCII

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: HypeTek-Mission-Control-Agent-Setup
          path: |
            windows-installer/dist/HypeTek-Mission-Control-Agent-Setup.exe
            windows-installer/dist/release-manifest.txt
          if-no-files-found: error

      - name: Publish versioned release and installer
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          $tag = "v$version"
          $releaseExists = $false
          try {
            gh release view $tag --json tagName | Out-Null
            $releaseExists = ($LASTEXITCODE -eq 0)
          }
          catch {
            $releaseExists = $false
          }
          if (-not $releaseExists) {
            $releaseArgs = @(
              "release", "create", $tag,
              "--target", "${{ github.sha }}",
              "--generate-notes",
              "--title", "HypeTek Mission Control $tag"
            )
            if ($version -match '-') {
              $releaseArgs += "--prerelease"
            }
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag `
            "windows-installer/dist/HypeTek-Mission-Control-Agent-Setup.exe" `
            "windows-installer/dist/release-manifest.txt" `
            --clobber
